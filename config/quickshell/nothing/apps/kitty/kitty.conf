# Kitty config used only inside Hyprland (KITTY_CONFIG_DIRECTORY points here).
# Defaults first; your own ~/.config/kitty/kitty.conf (if any) overrides them;
# the wallpaper colours and translucency always win.

font_family      JetBrainsMono Nerd Font
font_size        11.0
window_padding_width 18
cursor_shape     beam
confirm_os_window_close 0
enable_audio_bell no

include ~/.config/kitty/kitty.conf

include ~/.local/state/nothing/kitty-colors.conf

# Slight translucency so Hyprland blur shows through
background_opacity 0.82
